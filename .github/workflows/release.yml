name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

jobs:
  verify-quality:
    name: Verify release quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Match package metadata to tag
        run: npm run version:check -- --tag="$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Require release commit on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc -b
      - name: Test with coverage
        run: npm run test:coverage

  e2e:
    name: Browser tests
    needs: verify-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npm run test:e2e

  create-release:
    name: Create draft release
    needs: [verify-quality, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create draft release
        run: gh release create "$RELEASE_TAG" --draft --title "$RELEASE_TAG" --notes-file "changelogs/$RELEASE_TAG.md"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux AppImage and Debian
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build packages
        run: npm run build:app
      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/*-Win.exe')) { throw 'Windows installer was not created.' }
          if (-not (Test-Path 'release/*-Win-Portable.exe')) { throw 'Windows portable package was not created.' }
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: compgen -G 'release/*-Mac.dmg' > /dev/null
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          compgen -G 'release/*-Linux.AppImage' > /dev/null
          compgen -G 'release/*-Linux.deb' > /dev/null
      - name: Stage Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            release/*-Win.exe
            release/*-Win-Portable.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1
      - name: Stage macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: |
            release/*-Mac.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
      - name: Stage Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: |
            release/*-Linux.AppImage
            release/*-Linux.deb
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 1

  publish-release-assets:
    name: Publish draft release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download staged packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish packages to draft release
        shell: bash
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}

  verify-release-assets:
    name: Verify draft release assets
    needs: publish-release-assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Verify draft notes and required packages
        shell: bash
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG is not a draft."
            exit 1
          fi

          expected_notes="$(cat "changelogs/$RELEASE_TAG.md")"
          actual_notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          if [[ "$actual_notes" != "$expected_notes" ]]; then
            echo "Release notes do not match changelogs/$RELEASE_TAG.md."
            diff -u \
              <(printf '%s\n' "$expected_notes") \
              <(printf '%s\n' "$actual_notes") || true
            exit 1
          fi

          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          required_patterns=(
            '-Win\.exe$'
            '-Win-Portable\.exe$'
            '-Mac\.dmg$'
            '-Linux\.AppImage$'
            '-Linux\.deb$'
          )

          for pattern in "${required_patterns[@]}"; do
            if ! grep -Eq -- "$pattern" <<< "$assets"; then
              echo "Missing release asset matching: $pattern"
              echo "$assets"
              exit 1
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
