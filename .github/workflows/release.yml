name: Release

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [release-main]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-source:
    name: Validate tagged dev to main squash merge
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ready: ${{ steps.source.outputs.ready }}
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.client_payload.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - name: Resolve release tag from merged PR
        id: source
        run: node .github/release-source.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.event.client_payload.sha || github.sha }}

  create-release:
    name: Create draft release
    needs: release-source
    if: needs.release-source.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - name: Create draft release
        shell: bash
        run: |
          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace published release $RELEASE_TAG." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file "changelogs/$RELEASE_TAG.md"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "changelogs/$RELEASE_TAG.md"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-source.outputs.tag }}

  build:
    name: Build (${{ matrix.name }})
    needs: [release-source, create-release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux AppImage and Debian
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build packages
        run: npm run build:app
      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/*-Win.exe')) { throw 'Windows installer was not created.' }
          if (-not (Test-Path 'release/*-Win-Portable.exe')) { throw 'Windows portable package was not created.' }
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: compgen -G 'release/*-Mac.dmg' > /dev/null
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          compgen -G 'release/*-Linux.AppImage' > /dev/null
          compgen -G 'release/*-Linux.deb' > /dev/null
      - name: Stage Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            release/*-Win.exe
            release/*-Win-Portable.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1
      - name: Stage macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: |
            release/*-Mac.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
      - name: Stage Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: |
            release/*-Linux.AppImage
            release/*-Linux.deb
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 1

  publish-release-assets:
    name: Publish draft release assets
    needs: [release-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download staged packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish packages to draft release
        shell: bash
        run: |
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == "true" ]]
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-source.outputs.tag }}

  verify-release-assets:
    name: Verify draft release assets
    needs: [release-source, publish-release-assets]
    runs-on: ubuntu-latest
    permissions:
      # GitHub hides draft releases from read-only tokens.
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.release-source.outputs.sha }}
          persist-credentials: false
      - name: Verify draft notes and required packages
        shell: bash
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG is not a draft."
            exit 1
          fi

          expected_notes="$(cat "changelogs/$RELEASE_TAG.md")"
          actual_notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          if [[ "$actual_notes" != "$expected_notes" ]]; then
            echo "Release notes do not match changelogs/$RELEASE_TAG.md."
            diff -u \
              <(printf '%s\n' "$expected_notes") \
              <(printf '%s\n' "$actual_notes") || true
            exit 1
          fi

          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          empty_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.size <= 0) | .name')"
          version="${RELEASE_TAG#v}"
          required_assets=(
            "Notation-Labs-$version-Win.exe"
            "Notation-Labs-$version-Win-Portable.exe"
            "Notation-Labs-$version-Win.exe.blockmap"
            "latest.yml"
            "Notation-Labs-$version-Mac.dmg"
            "Notation-Labs-$version-Mac.dmg.blockmap"
            "latest-mac.yml"
            "Notation-Labs-$version-Linux.AppImage"
            "Notation-Labs-$version-Linux.deb"
            "latest-linux.yml"
          )

          for asset in "${required_assets[@]}"; do
            if ! grep -Fxq -- "$asset" <<< "$assets"; then
              echo "Missing release asset: $asset"
              echo "$assets"
              exit 1
            fi
          done

          if [[ -n "$empty_assets" ]]; then
            echo "Release contains empty assets:"
            echo "$empty_assets"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-source.outputs.tag }}

  cleanup-failed-draft:
    name: Remove failed draft release
    needs: [release-source, create-release, build, publish-release-assets, verify-release-assets]
    if: ${{ always() && needs.create-release.result == 'success' && needs.verify-release-assets.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete unpublished draft
        shell: bash
        run: |
          if ! is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "No release exists for $RELEASE_TAG; nothing to remove."
            exit 0
          fi

          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG is already published; it will not be removed."
            exit 0
          fi

          gh release delete "$RELEASE_TAG" --yes
          echo "Removed failed draft release $RELEASE_TAG."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release-source.outputs.tag }}
