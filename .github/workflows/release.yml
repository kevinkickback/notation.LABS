name: Release

on:
  repository_dispatch:
    types: [release-requested]

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.event.client_payload.source_sha }}

jobs:
  validate-source:
    name: Validate release source
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Require the current main revision
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          SOURCE_SHA: ${{ env.SOURCE_SHA }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const sourceSha = process.env.SOURCE_SHA ?? '';
            if (!/^[0-9a-f]{40}$/.test(sourceSha)) {
              throw new Error('A full main source SHA is required.');
            }
            const { data: branch } = await github.rest.repos.getBranch({ owner, repo, branch: 'main' });
            if (branch.commit.sha !== sourceSha) {
              throw new Error('main changed before release preparation; run the workflow again.');
            }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Fetch published release tags
        shell: bash
        run: |
          mkdir -p release-metadata
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            > release-metadata/published-tags.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
      - name: Validate release version and changelog
        id: release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/check-release.mjs \
            --published-tags-file release-metadata/published-tags.txt \
            --notes-file release-metadata/release-notes.md
          tag="v$version"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Preserve validated release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-metadata/release-notes.md
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  release-state:
    name: Inspect protected release state
    needs: validate-source
    runs-on: ubuntu-26.04
    # Draft releases are visible only to a token with push access. This job
    # does not check out or execute repository-controlled code.
    permissions:
      contents: write
    outputs:
      initial_tag_state: ${{ steps.state.outputs.initial_tag_state }}
      initial_tag_sha: ${{ steps.state.outputs.initial_tag_sha }}
    env:
      RELEASE_TAG: ${{ needs.validate-source.outputs.tag }}
    steps:
      - name: Require clean release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          lookup_releases() {
            local output
            if output="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft] | @tsv" 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            echo "$output" >&2
            return 1
          }

          lookup_tag_sha() {
            local output
            if output="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            if [[ "$output" == *"HTTP 404"* ]]; then
              return 4
            fi
            echo "$output" >&2
            return 1
          }

          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [[ "$current_main_sha" != "$SOURCE_SHA" ]]; then
            echo "main changed before release-state inspection; run the release again." >&2
            exit 1
          fi

          tag_found=false
          if existing_sha="$(lookup_tag_sha)"; then
            tag_found=true
          else
            tag_lookup_status=$?
            if [[ "$tag_lookup_status" -ne 4 ]]; then
              echo "Could not verify the state of tag $RELEASE_TAG; refusing to continue." >&2
              exit 1
            fi
          fi

          if ! release_info="$(lookup_releases)"; then
            echo "Could not enumerate releases for $RELEASE_TAG; refusing to continue." >&2
            exit 1
          fi

          draft_count=0
          while IFS=$'\t' read -r release_id release_is_draft; do
            [[ -z "$release_id" ]] && continue
            if [[ "$release_is_draft" != "true" ]]; then
              echo "Release $RELEASE_TAG is published; refusing to modify it." >&2
              exit 1
            fi
            draft_count=$((draft_count + 1))
          done <<<"$release_info"

          if [[ "$tag_found" == "true" && "$existing_sha" != "$SOURCE_SHA" ]]; then
            echo "Tag $RELEASE_TAG points to $existing_sha instead of $SOURCE_SHA; inspect and remove the unpublished tag before rerunning." >&2
            exit 1
          fi
          if [[ "$draft_count" -gt 0 ]]; then
            echo "$draft_count draft(s) already exist for $RELEASE_TAG; inspect and remove them before rerunning." >&2
            exit 1
          fi

          if [[ "$tag_found" == "true" ]]; then
            echo "initial_tag_state=present" >> "$GITHUB_OUTPUT"
            echo "initial_tag_sha=$existing_sha" >> "$GITHUB_OUTPUT"
          else
            echo "initial_tag_state=missing" >> "$GITHUB_OUTPUT"
            echo "initial_tag_sha=" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: [validate-source, release-state]
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build artifacts and update manifests without publishing
        run: npm run build:app
      - name: Preserve build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish-release:
    name: Create and populate draft release
    needs: [validate-source, release-state, build]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.validate-source.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate-source.outputs.version }}
      INITIAL_TAG_STATE: ${{ needs.release-state.outputs.initial_tag_state }}
      INITIAL_TAG_SHA: ${{ needs.release-state.outputs.initial_tag_sha }}
    steps:
      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-metadata
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-build-*
          path: release-artifacts
          merge-multiple: true
      - name: Validate completed artifact bundle
        shell: bash
        run: |
          require_file() {
            if [[ ! -s "release-artifacts/$1" ]]; then
              echo "::error::Missing or empty completed build artifact: $1"
              exit 1
            fi
          }

          require_manifest() {
            local manifest="$1"
            local expected="$2"
            local manifest_path="release-artifacts/$manifest"
            if [[ "$(grep -Fxc "path: $expected" "$manifest_path" || true)" -ne 1 ]] ||
               [[ "$(grep -Fxc "  - url: $expected" "$manifest_path" || true)" -ne 1 ]] ||
               ! grep -Eq '^sha512: [A-Za-z0-9+/=]+$' "$manifest_path"; then
              echo "::error::$manifest does not describe the expected artifact $expected."
              exit 1
            fi
          }

          require_file "Notation-Labs-$RELEASE_VERSION-Win.exe"
          require_file "Notation-Labs-$RELEASE_VERSION-Win-Portable.exe"
          require_file "Notation-Labs-$RELEASE_VERSION-Win.exe.blockmap"
          require_file "Notation-Labs-$RELEASE_VERSION-Mac.dmg"
          require_file "Notation-Labs-$RELEASE_VERSION-Mac.dmg.blockmap"
          require_file "Notation-Labs-$RELEASE_VERSION-Linux.AppImage"
          require_file "Notation-Labs-$RELEASE_VERSION-Linux.deb"
          require_file 'latest.yml'
          require_file 'latest-mac.yml'
          require_file 'latest-linux.yml'

          require_manifest 'latest.yml' "Notation-Labs-$RELEASE_VERSION-Win.exe"
          require_manifest 'latest-mac.yml' "Notation-Labs-$RELEASE_VERSION-Mac.dmg"
          require_manifest 'latest-linux.yml' "Notation-Labs-$RELEASE_VERSION-Linux.AppImage"

          shopt -s nullglob
          artifact_files=(release-artifacts/*)
          if [[ "${#artifact_files[@]}" -ne 10 ]]; then
            echo "::error::Expected exactly 10 release artifacts; found ${#artifact_files[@]}."
            printf '%s\n' "${artifact_files[@]}"
            exit 1
          fi
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-artifacts/*.exe
            release-artifacts/*.dmg
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.blockmap
            release-artifacts/latest*.yml
      - name: Create draft from completed artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          lookup_releases() {
            local output
            if output="$(gh api --paginate \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft, .updated_at] | @tsv" 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            echo "$output" >&2
            return 1
          }

          lookup_tag_sha() {
            local output
            if output="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>&1)"; then
              printf '%s' "$output"
              return 0
            fi
            if [[ "$output" == *"HTTP 404"* ]]; then
              return 4
            fi
            echo "$output" >&2
            return 1
          }

          assert_current_main() {
            local current_main_sha
            if ! current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"; then
              echo "Could not verify the current main revision; refusing to continue." >&2
              exit 1
            fi
            if [[ "$current_main_sha" != "$SOURCE_SHA" ]]; then
              echo "main changed while release artifacts were building; run the workflow again." >&2
              exit 1
            fi
          }

          assert_no_releases() {
            local current_release_info
            if ! current_release_info="$(lookup_releases)"; then
              echo "Could not re-check releases for $RELEASE_TAG; refusing to continue." >&2
              exit 1
            fi
            if [[ -n "$current_release_info" ]]; then
              echo "A release for $RELEASE_TAG appeared while this run was active; refusing to continue." >&2
              exit 1
            fi
          }

          assert_current_main
          assert_no_releases

          tag_found=false
          if tag_sha="$(lookup_tag_sha)"; then
            tag_found=true
          else
            tag_lookup_status=$?
            if [[ "$tag_lookup_status" -ne 4 ]]; then
              echo "Could not verify the state of tag $RELEASE_TAG; refusing to continue." >&2
              exit 1
            fi
          fi

          if [[ "$INITIAL_TAG_STATE" == "present" ]]; then
            if [[ "$tag_found" != "true" || "$tag_sha" != "$INITIAL_TAG_SHA" ||
                  "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo "Tag $RELEASE_TAG changed after release preparation; refusing to continue." >&2
              exit 1
            fi
          elif [[ "$INITIAL_TAG_STATE" == "missing" ]]; then
            if [[ "$tag_found" == "true" ]]; then
              echo "Tag $RELEASE_TAG was created after release preparation; refusing to continue." >&2
              exit 1
            fi
          else
            echo "The initial tag state is unavailable; refusing to continue." >&2
            exit 1
          fi

          if [[ "$tag_found" != "true" ]]; then
            # Creating a new ref is atomic: a concurrent tag wins and this
            # request fails without moving any existing tag.
            assert_current_main
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" -f sha="$SOURCE_SHA"
          fi

          assert_current_main
          assert_no_releases
          if ! current_tag_sha="$(lookup_tag_sha)" || [[ "$current_tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Tag $RELEASE_TAG no longer points to $SOURCE_SHA; refusing to create a draft." >&2
            exit 1
          fi

          gh release create "$RELEASE_TAG" release-artifacts/* \
            --draft --title "$RELEASE_TAG" \
            --notes-file release-metadata/release-notes.md --verify-tag

          assert_current_main
          if ! current_tag_sha="$(lookup_tag_sha)" || [[ "$current_tag_sha" != "$SOURCE_SHA" ]]; then
            echo "Tag $RELEASE_TAG moved during draft creation; inspect the unpublished draft before rerunning." >&2
            exit 1
          fi

  verify-release:
    name: Verify draft release artifacts
    needs: [validate-source, publish-release]
    runs-on: ubuntu-26.04
    # GitHub exposes draft releases only to tokens with push access. This job
    # executes protected workflow code and performs read-only API calls.
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.validate-source.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate-source.outputs.version }}
    steps:
      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes
          path: release-metadata
      - name: Verify draft and artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! release_info="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | [.id, .draft] | @tsv")"; then
            echo "::error::Could not enumerate releases for $RELEASE_TAG."
            exit 1
          fi

          release_ids=()
          while IFS=$'\t' read -r release_id is_draft; do
            [[ -z "$release_id" ]] && continue
            if [[ "$is_draft" != "true" ]]; then
              echo "::error::Release $RELEASE_TAG is not a draft."
              exit 1
            fi
            release_ids+=("$release_id")
          done <<<"$release_info"

          if [[ "${#release_ids[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one draft for $RELEASE_TAG; found ${#release_ids[@]}."
            exit 1
          fi

          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/${release_ids[0]}")"
          assets="$(jq -r '.assets[].name' <<<"$release_json")"
          empty_assets="$(jq -r '.assets[] | select(.size <= 0) | .name' <<<"$release_json")"
          actual_notes="$(jq -r '.body // ""' <<<"$release_json")"
          expected_notes="$(cat release-metadata/release-notes.md)"
          if [[ "$actual_notes" != "$expected_notes" ]]; then
            echo "::error::Release notes do not match the validated changelog."
            diff -u \
              <(printf '%s\n' "$expected_notes") \
              <(printf '%s\n' "$actual_notes") || true
            exit 1
          fi
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha')"
          if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
            echo "::error::Tag $RELEASE_TAG points to $tag_sha instead of $SOURCE_SHA."
            exit 1
          fi

          missing=0
          require_asset() {
            local expected="$1"
            if ! grep -Fxq "$expected" <<<"$assets"; then
              echo "::error::Missing release asset: $expected"
              missing=1
            fi
          }

          require_asset "Notation-Labs-$RELEASE_VERSION-Win.exe"
          require_asset "Notation-Labs-$RELEASE_VERSION-Win-Portable.exe"
          require_asset "Notation-Labs-$RELEASE_VERSION-Win.exe.blockmap"
          require_asset "Notation-Labs-$RELEASE_VERSION-Mac.dmg"
          require_asset "Notation-Labs-$RELEASE_VERSION-Mac.dmg.blockmap"
          require_asset "Notation-Labs-$RELEASE_VERSION-Linux.AppImage"
          require_asset "Notation-Labs-$RELEASE_VERSION-Linux.deb"
          require_asset 'latest.yml'
          require_asset 'latest-mac.yml'
          require_asset 'latest-linux.yml'

          asset_count="$(grep -c . <<<"$assets")"
          if [[ "$asset_count" -ne 10 ]]; then
            echo "::error::Expected exactly 10 release assets; found $asset_count."
            missing=1
          fi
          if [[ -n "$empty_assets" ]]; then
            echo "::error::Release contains empty assets:"
            echo "$empty_assets"
            missing=1
          fi

          if [[ "$missing" -ne 0 ]]; then
            echo "Uploaded assets:"
            echo "$assets"
            exit 1
          fi
