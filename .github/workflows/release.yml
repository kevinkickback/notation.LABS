name: Release

on:
  workflow_call:
    inputs:
      source-sha:
        description: Squash merge commit that passed the dev to main PR checks
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source-sha:
        description: Existing release commit to rebuild and verify
        required: true
        type: string

permissions:
  contents: write
  pull-requests: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ inputs.source-sha }}

jobs:
  detect-version-change:
    name: Detect version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare package versions
        id: version
        shell: bash
        run: |
          current_version="$(node -p "require('./package.json').version")"
          previous_version="$(
            git show "$SOURCE_SHA^:package.json" |
              node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).version))'
          )"

          if [[ "$current_version" == "$previous_version" ]]; then
            echo "Package version remains $current_version; skipping release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Package version changed from $previous_version to $current_version."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  validate-release:
    name: Validate merged release source
    needs: detect-version-change
    if: needs.detect-version-change.outputs.changed == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the merged dev to main PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          matching_prs="$(
            gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA/pulls" \
              --jq "[.[] | select(.merged_at != null and .merge_commit_sha == \"$SOURCE_SHA\" and .base.ref == \"main\" and .head.ref == \"dev\" and .head.repo.full_name == \"$GITHUB_REPOSITORY\")] | length"
          )"
          if [[ "$matching_prs" -lt 1 ]]; then
            echo "Commit $SOURCE_SHA did not come from a merged, same-repository dev to main PR." >&2
            exit 1
          fi

          parent_count="$(git rev-list --parents -n 1 "$SOURCE_SHA" | wc -w)"
          if [[ "$parent_count" -ne 2 ]]; then
            echo "Release PRs must use squash merge." >&2
            exit 1
          fi
      - name: Validate release metadata
        id: metadata
        shell: bash
        run: |
          node scripts/release/check-release.mjs
          version="$(node -p "require('./package.json').version")"
          previous_version="$(
            git show "$SOURCE_SHA^:package.json" |
              node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input).version))'
          )"

          CURRENT_VERSION="$version" PREVIOUS_VERSION="$previous_version" node -e '
            const parse = (value) => value.split(".").map(Number);
            const compare = (left, right) => {
              for (let index = 0; index < 3; index++) {
                if (left[index] !== right[index]) return left[index] - right[index];
              }
              return 0;
            };
            if (compare(parse(process.env.CURRENT_VERSION), parse(process.env.PREVIOUS_VERSION)) <= 0) {
              throw new Error(`Release version must increase (${process.env.PREVIOUS_VERSION} -> ${process.env.CURRENT_VERSION}).`);
            }
          '

          tag="v$version"
          if existing_sha="$(git rev-list -n 1 "$tag" 2>/dev/null)"; then
            if [[ "$existing_sha" != "$SOURCE_SHA" ]]; then
              echo "Tag $tag already points to $existing_sha instead of $SOURCE_SHA." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: validate-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Create version tag
        shell: bash
        run: |
          if existing_sha="$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null)"; then
            if [[ "$existing_sha" != "$SOURCE_SHA" ]]; then
              echo "Tag $RELEASE_TAG already points to $existing_sha instead of $SOURCE_SHA." >&2
              exit 1
            fi
            echo "Reusing existing tag $RELEASE_TAG."
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$RELEASE_TAG" \
              -f sha="$SOURCE_SHA"
          fi
      - name: Prepare release notes
        run: node scripts/release/check-release.mjs --notes-file release-notes.md
      - name: Create or refresh draft release
        shell: bash
        run: |
          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "$is_draft" != "true" ]]; then
              echo "Refusing to replace published release $RELEASE_TAG." >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

  build:
    name: Build and attest (${{ matrix.name }})
    needs: [validate-release, create-release]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux AppImage and Debian
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build packages
        run: npm run build:app
      - name: Verify Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path 'release/*-Win.exe')) { throw 'Windows installer was not created.' }
          if (-not (Test-Path 'release/*-Win-Portable.exe')) { throw 'Windows portable package was not created.' }
      - name: Verify macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: compgen -G 'release/*-Mac.dmg' > /dev/null
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          compgen -G 'release/*-Linux.AppImage' > /dev/null
          compgen -G 'release/*-Linux.deb' > /dev/null
      - name: Attest Windows packages
        if: runner.os == 'Windows'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*-Win.exe
            release/*.exe.blockmap
            release/latest.yml
      - name: Attest macOS packages
        if: runner.os == 'macOS'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*-Mac.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
      - name: Attest Linux packages
        if: runner.os == 'Linux'
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*-Linux.AppImage
            release/*-Linux.deb
            release/*.blockmap
            release/latest-linux.yml
      - name: Stage Windows packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: |
            release/*-Win.exe
            release/*-Win-Portable.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1
      - name: Stage macOS package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: |
            release/*-Mac.dmg
            release/*.dmg.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1
      - name: Stage Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: |
            release/*-Linux.AppImage
            release/*-Linux.deb
            release/*.blockmap
            release/latest-linux.yml
          if-no-files-found: error
          retention-days: 1

  publish-release-assets:
    name: Publish draft release assets
    needs: [validate-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download staged packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish packages to draft release
        shell: bash
        run: |
          [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')" == "true" ]]
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}

  verify-release-assets:
    name: Verify draft release assets
    needs: [validate-release, publish-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Verify draft notes and required packages
        shell: bash
        run: |
          is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG is not a draft." >&2
            exit 1
          fi

          expected_notes="$(cat "changelogs/$RELEASE_TAG.md")"
          actual_notes="$(gh release view "$RELEASE_TAG" --json body --jq '.body')"
          if [[ "$actual_notes" != "$expected_notes" ]]; then
            echo "Release notes do not match changelogs/$RELEASE_TAG.md." >&2
            diff -u \
              <(printf '%s\n' "$expected_notes") \
              <(printf '%s\n' "$actual_notes") || true
            exit 1
          fi

          assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')"
          empty_assets="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.size <= 0) | .name')"
          version="${RELEASE_TAG#v}"
          required_assets=(
            "Notation-Labs-$version-Win.exe"
            "Notation-Labs-$version-Win-Portable.exe"
            "Notation-Labs-$version-Win.exe.blockmap"
            "latest.yml"
            "Notation-Labs-$version-Mac.dmg"
            "Notation-Labs-$version-Mac.dmg.blockmap"
            "latest-mac.yml"
            "Notation-Labs-$version-Linux.AppImage"
            "Notation-Labs-$version-Linux.deb"
            "latest-linux.yml"
          )

          for asset in "${required_assets[@]}"; do
            if ! grep -Fxq -- "$asset" <<< "$assets"; then
              echo "Missing release asset: $asset" >&2
              echo "$assets"
              exit 1
            fi
          done
          if [[ -n "$empty_assets" ]]; then
            echo "Release contains empty assets:" >&2
            echo "$empty_assets" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}

  cleanup-failed-draft:
    name: Remove failed draft and tag
    needs: [validate-release, create-release, build, publish-release-assets, verify-release-assets]
    if: ${{ always() && needs.create-release.result == 'success' && needs.verify-release-assets.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete unpublished draft and workflow-created tag
        shell: bash
        run: |
          if ! is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            echo "No release exists for $RELEASE_TAG; checking its tag."
          elif [[ "$is_draft" != "true" ]]; then
            echo "Release $RELEASE_TAG is already published; it and its tag will not be removed."
            exit 0
          else
            gh release delete "$RELEASE_TAG" --yes
            echo "Removed failed draft release $RELEASE_TAG."
          fi

          if tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '.object.sha' 2>/dev/null)"; then
            if [[ "$tag_sha" != "$SOURCE_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to $tag_sha, not $SOURCE_SHA; refusing to delete it." >&2
              exit 1
            fi
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG"
            echo "Removed workflow-created tag $RELEASE_TAG."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release.outputs.tag }}
